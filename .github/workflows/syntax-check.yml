name: LUMINARK Ultra Syntax Check

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/syntax-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/syntax-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q .
